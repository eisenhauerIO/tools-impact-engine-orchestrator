name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 6 * * *'  # Daily at 06:00 UTC

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install hatch
        run: pip install hatch "virtualenv<21"

      - name: Lint
        run: hatch run lint

      - name: Run tests and notebooks
        run: hatch run test

      - name: Generate tutorial data
        working-directory: docs/source/impact-loop
        run: hatch run python setup_data.py

      - name: Run tutorial notebook
        working-directory: docs/source/impact-loop
        run: hatch run pytest --nbmake impact-loop.ipynb
