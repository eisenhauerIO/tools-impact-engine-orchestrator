name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 6 * * *'  # Daily at 06:00 UTC
  workflow_dispatch:  # manual runs — also lets CI be kicked after GitHub's inactivity auto-disable

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]  # 3.10 dropped 2026-09: EOL next month, and current litellm imports typing.NotRequired (3.11+)

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install hatch
        run: pip install hatch "virtualenv<21"

      - name: Lint
        run: hatch run lint

      - name: Run tests and notebooks
        run: hatch run test
