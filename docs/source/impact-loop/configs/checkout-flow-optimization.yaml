DATA:
  SOURCE:
    type: simulator
    CONFIG:
      mode: rule
      seed: 202
      start_date: "2024-01-08"
      end_date: "2024-01-08"
      path: data/checkout-flow-optimization/products.csv
  ENRICHMENT:
    FUNCTION: product_detail_boost
